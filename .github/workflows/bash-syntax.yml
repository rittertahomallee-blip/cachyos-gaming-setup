name: Bash syntax

on:
  push:
    branches: [main, arena/**]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    name: Validate Bash syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run static Bash regression checks
        run: python3 tests/test_static.py
