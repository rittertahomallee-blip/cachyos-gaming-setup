name: Bash syntax

on:
  push:
    branches: [main, arena/**]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    name: Validate Bash syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse setup script
        run: bash -n cachyos-gaming-setup.sh
      - name: Exercise argument parser without changing the system
        run: |
          ./cachyos-gaming-setup.sh --help
          if ./cachyos-gaming-setup.sh --profile invalid; then
            echo 'Invalid profile unexpectedly succeeded.' >&2
            exit 1
          fi
